<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>공부시간에 따라 달라지는 나의 캐릭터 · 기획 시안</title>
<link rel="stylesheet" href="character-base.css">
<link rel="stylesheet" href="preview.css"><link rel="stylesheet" href="fire.css">
</head>
<body><main id="app"></main>
<script>
const stages = [
 {
  "hours": 0,
  "name": "공부 시작",
  "range": "0시간 이상 · 3시간 미만",
  "copy": "나만의 속도로 시작해요",
  "detail": "기존 캐릭터와 책상 그대로 시작합니다. 3시간부터 첫 불꽃이 나타납니다.",
  "change": "기존 캐릭터 · 불꽃 없음",
  "next": 3
 },
 {
  "hours": 3,
  "name": "집중의 불씨",
  "range": "3시간 이상 · 5시간 미만",
  "copy": "오늘의 집중에 불이 붙었어요",
  "detail": "몸 뒤에 작고 둥근 노란 불꽃이 피어납니다. 어깨 양옆에서 불씨를 확인할 수 있습니다.",
  "change": "작은 노란 불꽃 · 첫 점화",
  "next": 5
 },
 {
  "hours": 5,
  "name": "타오르는 집중",
  "range": "5시간 이상 · 7시간 미만",
  "copy": "집중의 불꽃이 자라고 있어요",
  "detail": "같은 불꽃이 어깨 위로 자라고 주황색으로 깊어집니다. 실루엣과 높이가 함께 달라집니다.",
  "change": "주황 불꽃 · 어깨 위로 성장",
  "next": 7
 },
 {
  "hours": 7,
  "name": "몰입의 불꽃",
  "range": "7시간 이상 · 9시간 미만",
  "copy": "꾸준한 몰입이 힘이 되었어요",
  "detail": "불꽃이 머리 위까지 올라오고 양옆으로 넓어집니다. 안쪽의 밝은 불꽃이 또렷해집니다.",
  "change": "짙은 주황 · 머리 위 불꽃",
  "next": 9
 },
 {
  "hours": 9,
  "name": "뜨거운 몰입",
  "range": "9시간 이상 · 10시간 미만",
  "copy": "오늘의 노력이 뜨겁게 빛나요",
  "detail": "붉은 바깥 불꽃이 한 겹 더해지고, 작은 불티 두 개가 보입니다. 캐릭터 앞은 계속 깨끗하게 유지합니다.",
  "change": "붉은 외곽 · 작은 불티 2개",
  "next": 10
 },
 {
  "hours": 10,
  "name": "황금 불꽃",
  "range": "10시간 이상",
  "copy": "오늘의 불꽃을 완성했어요. 잠깐 쉬어가요",
  "detail": "가장 넓고 풍성한 불꽃에 밝은 황금색 중심이 완성됩니다. 9시간의 붉은 테두리를 유지해 자연스럽게 이어집니다.",
  "change": "황금 중심 · 풍성한 최종 불꽃",
  "next": null
 }
];
const qs = new URLSearchParams(location.search);
let current = Math.max(0,stages.findIndex(s=>s.hours === Number(qs.get('stage')||0)));
let paused = false;
function scene(i,small=false){return `<div class="scene-window ${small?'small':''}"><div class="scene stage-${i} ${paused?'paused':''}" aria-label="${stages[i].name} 캐릭터"><div class="fire-layer" aria-hidden="true"><svg class="fire-svg" viewBox="0 0 120 124" xmlns="http://www.w3.org/2000/svg"><path class="fire-outer" d="M60 120C31 120 8 109 9 87C9 71 21 66 17 48C28 54 34 61 35 70C31 43 56 33 50 4C72 16 82 40 76 60C87 51 93 38 89 29C110 47 115 64 105 81C111 78 115 72 114 68C128 102 101 120 60 120Z"/><path class="fire-middle" d="M61 117C36 117 23 108 24 91C24 81 32 73 30 66C41 73 44 79 44 85C43 60 62 46 61 27C78 43 77 60 72 72C82 68 87 61 88 53C103 69 98 84 92 91C104 88 98 109 85 113C78 116 70 117 61 117Z"/><path class="fire-core" d="M63 117C45 117 39 107 42 96C45 87 54 82 55 70C64 77 68 85 65 94C73 91 77 84 78 78C91 96 83 117 63 117Z"/></svg><i class="ember ember-one"></i><i class="ember ember-two"></i></div><span class="study-cafe-seat-visual"><span class="study-cafe-chair-back"></span><span class="study-cafe-avatar navy"><i class="study-cafe-avatar-shadow"></i><i class="study-cafe-avatar-body"></i><i class="study-cafe-avatar-face"></i><i class="study-cafe-avatar-hair"></i></span><span class="study-cafe-desk"><span class="notes"><i></i><i></i></span><i class="study-cafe-desk-book"><b class="writing"></b><b class="bookmark"></b></i><i class="study-cafe-desk-cup"></i></span><span class="study-cafe-writing-arms"><i class="study-cafe-avatar-arm left"></i><i class="study-cafe-avatar-arm right"></i><i class="pencil"></i></span></span></div></div>`}
function time(s){return String(s.hours).padStart(2,'0')+':00:00'}
function mobile(i){const s=stages[i];return `<div class="phone"><div class="statusbar"><b>9:41</b><span>▮▮▮ &nbsp; ▰</span></div><header><span>‹</span><strong>나의 캐릭터</strong><span class="header-menu">···</span></header><div class="mobile-content"><div class="intro"><span>오늘의 나</span><span class="live-status">${paused?'Ⅱ 휴식 중':'● 집중 중'}</span></div><section class="hero"><div class="daily-label">오늘 순공시간</div><div class="timer">${time(s)}</div>${scene(i)}<div class="stage-tag">${s.hours===0?'시작':s.hours+'시간 달성'} · ${s.name}</div><p class="hero-copy">${s.copy}</p></section><section class="progress-card"><div class="progress-title"><strong>${s.next?'다음 변화까지':'오늘의 성장 완료'}</strong><span>${s.next?s.next-s.hours+'시간 남았어요':'10시간 달성'}</span></div><div class="milestones">${stages.slice(1).map((v,n)=>`<div class="mile ${i>n?'done':''}"><i>${i>n?'✓':''}</i><span>${v.hours}h</span></div>`).join('')}</div><p>${s.next?s.next+'시간이 되면 ‘'+stages[i+1].name+'’로 달라져요.':'오늘 완성한 모습은 하루가 끝날 때까지 유지돼요.'}</p></section><div class="mini-card"><div class="mini-symbol">◷</div><div><strong>시간이 쌓이면, 모습도 조금씩</strong><p>쉬는 시간에는 오늘의 모습이 유지돼요.</p></div></div><div class="customize"><span><b>내 스타일 그대로</b><small>선택한 옷과 모자는 계속 유지돼요</small></span><span>꾸미기 &nbsp; ›</span></div></div><footer><span>⌂<small>홈</small></span><span>☷<small>플래너</small></span><span class="active">▤<small>스터디카페</small></span><span>◯<small>마이</small></span></footer><div class="home-indicator"></div></div>`}
function board(){document.body.className='board-mode';app.innerHTML=`<div class="board"><div class="board-heading"><div><div class="eyebrow">RONPARK · CHARACTER STUDY / 02 · FIRE</div><h1>공부가 쌓일수록, 불꽃도 자라요.</h1><p>작은 노란 불씨에서 풍성한 황금 불꽃까지. 같은 캐릭터 뒤로 집중의 에너지가 자랍니다.</p></div><div class="proposal">기획 시안<br><b>하루 누적 순공시간 기준</b></div></div><div class="stage-grid">${stages.map((s,i)=>`<article class="stage-card"><div class="card-heading"><span class="stage-number">0${i+1}</span><span class="threshold">${s.hours===0?'기본':s.hours+'시간'}</span><span class="range">${s.hours===0?'3시간 미만':s.next?s.next+'시간 미만':'이후 유지'}</span></div>${scene(i)}<h2>${s.name}</h2><p>${s.change}</p><div class="sample-label">오늘 순공 <b>${time(s)}</b><span>${s.hours===0?'시작':s.hours+'h 달성'}</span></div></article>`).join('')}</div><div class="board-bottom"><div><b>불꽃은 자라고, 나의 캐릭터는 그대로.</b><span>얼굴 · 머리 · 체형 · 옷 색상 유지 / 단계 전환 0.8초 / 휴식 중에도 달성 모습 유지</span></div><span>실제 CSS 캐릭터 기반 · 운영 앱 미반영</span></div></div>`}
function render(){if(qs.get('view')==='board')return board();document.body.className=qs.has('capture')?'capture-mode':'preview-mode';app.innerHTML=`<div class="preview-layout">${mobile(current)}<aside><div class="eyebrow">INTERACTIVE UI PREVIEW</div><h1>오늘의 집중에<br>불이 붙어요.</h1><p class="aside-copy">단계를 눌러 같은 캐릭터의 변화를 비교하세요.<br>실제 앱에 적용하기 전 검토용 시안입니다.</p><div class="stage-controls">${stages.map((s,i)=>`<button class="${i===current?'selected':''}" data-step="${i}" aria-pressed="${i===current}">${s.hours===0?'기본':s.hours+'시간'}</button>`).join('')}</div><div class="stage-description"><small>${stages[current].range}</small><h2>${stages[current].name}</h2><p>${stages[current].detail}</p></div><button id="pause" class="pause-toggle">${paused?'공부 중 모습 보기':'휴식 중 모습 보기'}</button><div class="design-note"><b>자연스러운 변화의 원칙</b><p>얼굴과 옷을 바꾸지 않아요.<br>같은 불꽃의 크기와 색이 조금씩 깊어져요.<br>10시간 이후에는 현재 모습을 유지해요.</p></div><a class="board-link" href="?view=board">전체 단계 한눈에 보기 ↗</a></aside></div>`;document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{current=Number(b.dataset.step);render()});document.getElementById('pause').onclick=()=>{paused=!paused;render()}}
render();
</script></body></html>
