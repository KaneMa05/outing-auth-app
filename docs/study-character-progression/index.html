<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>공부시간에 따라 달라지는 나의 캐릭터 · 기획 시안</title>
<link rel="stylesheet" href="character-base.css">
<link rel="stylesheet" href="preview.css">
</head>
<body><main id="app"></main>
<script>
const stages = [
 {hours:0,name:'공부 시작',range:'0시간 이상 · 3시간 미만',copy:'나만의 속도로 시작해요',detail:'지금의 캐릭터 그대로. 편안한 자세와 기본 책상에서 시작합니다.',change:'기존 캐릭터 · 기본 책상',next:3},
 {hours:3,name:'집중에 들어선 나',range:'3시간 이상 · 5시간 미만',copy:'차분히 집중이 쌓이고 있어요',detail:'고개가 살짝 책으로 향하고, 손끝의 연필과 첫 필기 흔적이 보입니다.',change:'살짝 숙인 고개 · 연필 · 필기',next:5},
 {hours:5,name:'흐름을 찾은 나',range:'5시간 이상 · 7시간 미만',copy:'공부에 나만의 리듬이 생겼어요',detail:'자세는 유지하며 책갈피와 정리 노트가 더해집니다. 민트빛이 살짝 감돕니다.',change:'책갈피 · 정리 노트 · 옅은 민트빛',next:7},
 {hours:7,name:'깊이 몰입한 나',range:'7시간 이상 · 9시간 미만',copy:'꾸준히 쌓아온 시간이 보여요',detail:'정리 노트가 한 장 더 쌓이고, 몸 뒤로 부드러운 집중빛이 자리 잡습니다.',change:'겹친 노트 · 부드러운 집중빛',next:9},
 {hours:9,name:'빛나는 집중',range:'9시간 이상 · 10시간 미만',copy:'오늘의 노력이 은은하게 빛나요',detail:'민트빛이 따뜻한 금빛으로 이어지고, 어깨 옆에 작은 반짝임 두 개가 생깁니다.',change:'따뜻한 금빛 · 작은 반짝임 2개',next:10},
 {hours:10,name:'오늘의 결실',range:'10시간 이상',copy:'충분히 쌓았어요. 잠깐 쉬어가요',detail:'기존 모습에 얇은 금빛 아치와 작은 별 하나가 더해져 오늘의 성취를 완성합니다.',change:'얇은 금빛 아치 · 성취의 별',next:null}
];
const qs = new URLSearchParams(location.search);
let current = Math.max(0,stages.findIndex(s=>s.hours === Number(qs.get('stage')||0)));
let paused = false;
function scene(i,small=false){return `<div class="scene-window ${small?'small':''}"><div class="scene stage-${i} ${paused?'paused':''}" aria-label="${stages[i].name} 캐릭터"><div class="aura"></div><div class="achievement-arc"></div><i class="spark a">✦</i><i class="spark b">✦</i><i class="achievement-star">★</i><span class="study-cafe-seat-visual"><span class="study-cafe-chair-back"></span><span class="study-cafe-avatar navy"><i class="study-cafe-avatar-shadow"></i><i class="study-cafe-avatar-body"></i><i class="study-cafe-avatar-face"></i><i class="study-cafe-avatar-hair"></i></span><span class="study-cafe-desk"><span class="notes"><i></i><i></i></span><i class="study-cafe-desk-book"><b class="writing"></b><b class="bookmark"></b></i><i class="study-cafe-desk-cup"></i></span><span class="study-cafe-writing-arms"><i class="study-cafe-avatar-arm left"></i><i class="study-cafe-avatar-arm right"></i><i class="pencil"></i></span></span></div></div>`}
function time(s){return String(s.hours).padStart(2,'0')+':00:00'}
function mobile(i){const s=stages[i];return `<div class="phone"><div class="statusbar"><b>9:41</b><span>▮▮▮ &nbsp; ▰</span></div><header><span>‹</span><strong>나의 캐릭터</strong><span class="header-menu">···</span></header><div class="mobile-content"><div class="intro"><span>오늘의 나</span><span class="live-status">${paused?'Ⅱ 휴식 중':'● 집중 중'}</span></div><section class="hero"><div class="daily-label">오늘 순공시간</div><div class="timer">${time(s)}</div>${scene(i)}<div class="stage-tag">${s.hours===0?'시작':s.hours+'시간 달성'} · ${s.name}</div><p class="hero-copy">${s.copy}</p></section><section class="progress-card"><div class="progress-title"><strong>${s.next?'다음 변화까지':'오늘의 성장 완료'}</strong><span>${s.next?s.next-s.hours+'시간 남았어요':'10시간 달성'}</span></div><div class="milestones">${stages.slice(1).map((v,n)=>`<div class="mile ${i>n?'done':''}"><i>${i>n?'✓':''}</i><span>${v.hours}h</span></div>`).join('')}</div><p>${s.next?s.next+'시간이 되면 ‘'+stages[i+1].name+'’로 달라져요.':'오늘 완성한 모습은 하루가 끝날 때까지 유지돼요.'}</p></section><div class="mini-card"><div class="mini-symbol">◷</div><div><strong>시간이 쌓이면, 모습도 조금씩</strong><p>쉬는 시간에는 오늘의 모습이 유지돼요.</p></div></div><div class="customize"><span><b>내 스타일 그대로</b><small>선택한 옷과 모자는 계속 유지돼요</small></span><span>꾸미기 &nbsp; ›</span></div></div><footer><span>⌂<small>홈</small></span><span>☷<small>플래너</small></span><span class="active">▤<small>스터디카페</small></span><span>◯<small>마이</small></span></footer><div class="home-indicator"></div></div>`}
function board(){document.body.className='board-mode';app.innerHTML=`<div class="board"><div class="board-heading"><div><div class="eyebrow">RONPARK · CHARACTER STUDY / 01</div><h1>같은 나, 조금 더 깊어진 집중.</h1><p>기존 캐릭터를 유지하고, 오늘 쌓은 시간만큼 자세와 공부의 흔적을 더합니다.</p></div><div class="proposal">기획 시안<br><b>하루 누적 순공시간 기준</b></div></div><div class="stage-grid">${stages.map((s,i)=>`<article class="stage-card"><div class="card-heading"><span class="stage-number">0${i+1}</span><span class="threshold">${s.hours===0?'기본':s.hours+'시간'}</span><span class="range">${s.hours===0?'3시간 미만':s.next?s.next+'시간 미만':'이후 유지'}</span></div>${scene(i)}<h2>${s.name}</h2><p>${s.change}</p><div class="sample-label">오늘 순공 <b>${time(s)}</b><span>${s.hours===0?'시작':s.hours+'h 달성'}</span></div></article>`).join('')}</div><div class="board-bottom"><div><b>변화는 겹쳐지고, 캐릭터는 유지됩니다.</b><span>얼굴 · 머리 · 체형 · 옷 색상 유지 / 단계 전환 0.8초 / 휴식 중에도 달성 모습 유지</span></div><span>실제 CSS 캐릭터 기반 · 운영 앱 미반영</span></div></div>`}
function render(){if(qs.get('view')==='board')return board();document.body.className=qs.has('capture')?'capture-mode':'preview-mode';app.innerHTML=`<div class="preview-layout">${mobile(current)}<aside><div class="eyebrow">INTERACTIVE UI PREVIEW</div><h1>오늘의 집중이<br>모습으로 남도록.</h1><p class="aside-copy">단계를 눌러 같은 캐릭터의 변화를 비교하세요.<br>실제 앱에 적용하기 전 검토용 시안입니다.</p><div class="stage-controls">${stages.map((s,i)=>`<button class="${i===current?'selected':''}" data-step="${i}" aria-pressed="${i===current}">${s.hours===0?'기본':s.hours+'시간'}</button>`).join('')}</div><div class="stage-description"><small>${stages[current].range}</small><h2>${stages[current].name}</h2><p>${stages[current].detail}</p></div><button id="pause" class="pause-toggle">${paused?'공부 중 모습 보기':'휴식 중 모습 보기'}</button><div class="design-note"><b>자연스러운 변화의 원칙</b><p>얼굴과 옷을 바꾸지 않아요.<br>공부 흔적과 빛을 단계마다 한 겹씩 더해요.<br>10시간 이후에는 현재 모습을 유지해요.</p></div><a class="board-link" href="?view=board">전체 단계 한눈에 보기 ↗</a></aside></div>`;document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{current=Number(b.dataset.step);render()});document.getElementById('pause').onclick=()=>{paused=!paused;render()}}
render();
</script></body></html>
