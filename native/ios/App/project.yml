# Cloud build: .github/workflows/ios-native-build.yml (no local Mac required).
# Local macOS alternative: xcodegen generate && open RonparkStudy.xcodeproj.
name: RonparkStudy
options:
  deploymentTarget:
    iOS: "16.0"
packages:
  InterviewNative:
    path: ../InterviewNative
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
targets:
  RonparkStudy:
    type: application
    platform: iOS
    postBuildScripts:
      - name: Debug interview practice resources
        script: bash "$SRCROOT/copy-debug-resources.sh"
        basedOnDependencyAnalysis: false
    sources:
      - Sources
      - Assets.xcassets
    dependencies:
      - package: InterviewNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ronpark.study
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        APP_DISPLAY_NAME: 론박스터디
        CAMERA_USAGE_DESCRIPTION: 모의면접 중 내 모습 미리보기에 카메라를 사용합니다. 영상은 저장하지 않습니다.
      configs:
        Debug:
          APP_DISPLAY_NAME: 론박스터디 테스트
          CAMERA_USAGE_DESCRIPTION: 모의면접 미리보기와 선택한 연습 영상 녹화에 카메라를 사용합니다. 영상은 이 기기에만 저장됩니다.
  InterviewPolicyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/Policy
    dependencies:
      - package: InterviewNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ronpark.study.policytests
        GENERATE_INFOPLIST_FILE: YES
  InterviewUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UI
    dependencies:
      - target: RonparkStudy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ronpark.study.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RonparkStudy
schemes:
  RonparkStudy:
    build:
      targets:
        RonparkStudy: all
        InterviewPolicyTests: [test]
        InterviewUITests: [test]
    test:
      config: Debug
      targets:
        - InterviewPolicyTests
        - InterviewUITests
      gatherCoverageData: false
