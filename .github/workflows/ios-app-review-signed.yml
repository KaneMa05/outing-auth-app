name: iOS App Review signed upload

on:
  push:
    branches: ['codex/ios-signed-review-20261109-github']

permissions:
  contents: read

concurrency:
  group: ios-app-review-signed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive-and-upload:
    if: github.ref == 'refs/heads/codex/ios-signed-review-20261109-github'
    runs-on: macos-15
    timeout-minutes: 30
    environment: ronpark-app-review-signing-20261109
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RONPARK_BUILD_NUMBER: '5'
      RONPARK_TEAM_ID: 3A8HPYVQ7M
      RONPARK_PROFILE_NAME: RONPARK Study GitHub App Store 20261109
      RONPARK_ASC_KEY_ID: 7MQQAK26JR
      RONPARK_ASC_ISSUER_ID: 556220a5-e0bb-4510-8e52-213416fbec2b
    steps:
      - name: Checkout reviewed native source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned XcodeGen
        run: bash scripts/ios/install-tools.sh
      - name: Sign and upload build without submitting or releasing
        env:
          RONPARK_SIGNING_P12_B64: ${{ secrets.RONPARK_SIGNING_P12_B64 }}
          RONPARK_SIGNING_P12_PASSWORD: ${{ secrets.RONPARK_SIGNING_P12_PASSWORD }}
          RONPARK_SIGNING_PROFILE_B64: ${{ secrets.RONPARK_SIGNING_PROFILE_B64 }}
          RONPARK_ASC_PRIVATE_KEY_B64: ${{ secrets.RONPARK_ASC_PRIVATE_KEY_B64 }}
        run: bash scripts/ios/build-signed-review.sh
      - name: Keep non-sensitive delivery status
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ios-app-review-delivery-${{ github.run_number }}
          path: artifacts/ios-signed-review/build-status.json
          if-no-files-found: warn
          retention-days: 3
